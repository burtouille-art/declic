# Collecte des flux RSS puis publication sur GitHub Pages.
# - toutes les 6 heures (minute 17 pour éviter l'engorgement de l'heure pile)
# - à chaque push sur main
# - à la demande : onglet Actions > « Collecte et déploiement » > Run workflow
name: Collecte et déploiement

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Si Pages n'est pas encore activé, on continue : la collecte et le build sont quand même vérifiés.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dépendances Python
        run: pip install -r pipeline/requirements.txt

      - name: Tests du pipeline
        run: python -m pytest pipeline/tests -q

      - name: Récupérer les dernières données publiées (filet de sécurité)
        run: |
          mkdir -p previous
          for f in news.json status.json onthisday.json photos.json; do
            curl -fsSL --max-time 20 "${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}/data/$f" -o "previous/$f" || rm -f "previous/$f"
          done
          ls -la previous

      - name: Collecte des flux RSS
        run: python pipeline/run.py --out public/data --previous previous
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Tests unitaires (jeux, contenus, données)
        run: npm test
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub suspend les workflows planifiés après 60 jours sans activité sur le dépôt.
  # Si le dernier commit date de plus de 45 jours, un commit vide relance le compteur :
  # la collecte quotidienne ne s'arrête jamais toute seule.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Maintenir la collecte planifiée active
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Dernier commit il y a $days jours"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: maintien de la collecte planifiée (aucun commit depuis $days jours)"
            git push
          fi
